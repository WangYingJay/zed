[package]
name = "tree-sitter-vue"
version = "0.1.0"
edition.workspace = true
publish = false
license = "MIT"
description = "Vendored tree-sitter-vue bindings for the slim built-in language whitelist"

[lib]
path = "lib.rs"
doctest = false

[dependencies]
# 经根 Cargo.toml [patch.crates-io] 统一到与 git tree-sitter 同 rev，避免 LanguageFn 类型分裂。
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1"
