[package]
name = "title_bar"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/title_bar.rs"
doctest = false

[features]
default = []
# 通话/屏幕共享 UI：依赖 call + livekit，由 zed 的 calls feature 打开
# channel / remote_connection 仅 collab 用，随 calls 打开
calls = ["dep:call", "dep:livekit_client", "dep:channel", "dep:remote_connection", "gpui/screen-capture"]

test-support = [
    "calls",
    "call/test-support",
    "client/test-support",

    "gpui/test-support",

    "project/test-support",
    "remote/test-support",
    "util/test-support",
    "workspace/test-support",
    "recent_projects/test-support",
]

[dependencies]
anyhow.workspace = true
# B档第五刀：去掉 auto_update（更新条 stub）
fs.workspace = true
platform_title_bar.workspace = true
call = { workspace = true, optional = true }
channel = { workspace = true, optional = true }
chrono.workspace = true
client.workspace = true
cloud_api_types.workspace = true
command_palette_hooks.workspace = true
db.workspace = true

git_ui_core.workspace = true
gpui.workspace = true
icons.workspace = true
livekit_client = { workspace = true, optional = true }
path.workspace = true
project.workspace = true
recent_projects.workspace = true
remote.workspace = true
remote_connection = { workspace = true, optional = true }
rpc.workspace = true
semver.workspace = true
schemars.workspace = true
serde.workspace = true
settings.workspace = true
smallvec.workspace = true
telemetry.workspace = true
theme.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true
zed_actions.workspace = true
arrayvec = "0.7.6"

[dev-dependencies]
call = { workspace = true, features = ["test-support"] }
client = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
recent_projects = { workspace = true, features = ["test-support"] }
remote = { workspace = true, features = ["test-support"] }
rpc = { workspace = true, features = ["test-support"] }
semver.workspace = true
settings = { workspace = true, features = ["test-support"] }
theme_settings.workspace = true
util = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
